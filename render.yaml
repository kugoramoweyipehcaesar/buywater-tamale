# Optional Render Blueprint — or configure manually in the dashboard
services:
  - type: web
    name: buywater
    runtime: node
    plan: free
    buildCommand: npm install && npx prisma generate && npm run build
    startCommand: npm run render:start
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: buywater-db
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: NEXTAUTH_SECRET
        generateValue: true
      - key: SUPER_ADMIN_EMAIL
        value: kugoramoweyipehcaesar49@gmail.com
      - key: APP_URL
        sync: false

databases:
  - name: buywater-db
    plan: free
